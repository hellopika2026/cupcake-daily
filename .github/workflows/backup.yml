name: Robot dự phòng (Gemini)
on:
  schedule:
    - cron: "0 7 * * *"   # 1 lần mỗi ngày lúc 14:00 giờ Việt Nam; nếu máy bạn đã quét rồi thì robot tự bỏ qua
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robot/requirements.txt
      - run: pip install -r robot/requirements.txt
      - name: Quét nguồn
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python robot/cupcake_robot.py --mode backup
          else
            python robot/cupcake_robot.py --mode backup --skip-if-done-today
          fi
      - name: Giữ lịch chạy luôn bật (GitHub tắt lịch nếu repo im lặng 60 ngày)
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $((now-last)) -gt 4320000 ]; then
            git config user.name "cupcake-daily-bot"; git config user.email "bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"; git push
          fi
