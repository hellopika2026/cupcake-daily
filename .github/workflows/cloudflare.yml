name: Đăng web (Cloudflare)
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/cloudflare.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Kiểm tra đã có khóa Cloudflare chưa
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Thiếu secret CLOUDFLARE_API_TOKEN hoặc CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions)."; exit 1
          fi
      - name: Đăng thư mục site lên Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy site --project-name cupcake-daily --branch main --commit-dirty=true
