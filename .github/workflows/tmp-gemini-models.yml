name: TẠM - liệt kê model Gemini
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Liệt kê model hỗ trợ generateContent
        env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -s "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" -H "x-goog-api-key: $K" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('error') or ''); [print(m['name']) for m in d.get('models',[]) if 'generateContent' in m.get('supportedGenerationMethods',[]) and 'flash' in m['name']]"
