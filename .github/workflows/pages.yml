name: Đăng web
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Điền cấu hình Supabase vào web
        env:
          SB_URL: ${{ vars.SUPABASE_URL }}
          SB_ANON: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SB_URL" ] && [ -n "$SB_ANON" ]; then
            printf 'window.CUPCAKE = { url: "%s", anonKey: "%s" };\n' "$SB_URL" "$SB_ANON" > site/config.js
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: dep
        uses: actions/deploy-pages@v5
